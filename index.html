<script>
(function () {
  'use strict';

  // Change previous saved default names to Shravan.
  // Do not overwrite other users' chosen names.
  var savedName = localStorage.getItem('steeradar-name');

  if (
    !savedName ||
    /^(surya|sr1|sai)(\s|$)/i.test(savedName.trim())
  ) {
    localStorage.setItem('steeradar-name', 'Shravan');
  }

  // Update the visible profile avatar.
  function updateShravanProfile() {
    var name = localStorage.getItem('steeradar-name') || 'Shravan';

    var avatar = document.getElementById('avatarBtn');
    if (avatar) {
      avatar.textContent = name.charAt(0).toUpperCase();
    }

    var profileInput = document.getElementById('setName');
    if (profileInput && !profileInput.value) {
      profileInput.placeholder = 'Shravan';
    }
  }

  // Update account registration examples.
  function updateRegistrationExamples() {
    var nameField = document.getElementById('authName');
    var usernameField = document.getElementById('authUsername');

    if (nameField) {
      nameField.placeholder = 'e.g. Shravan';
    }

    if (usernameField) {
      usernameField.placeholder = 'e.g. shravan';
    }
  }

  // Update the About section without removing diagnostics.
  function updateMaintainer() {
    var aboutSection = Array.from(
      document.querySelectorAll('.settings-section')
    ).find(function (section) {
      var heading = section.querySelector('.settings-label');
      return heading && heading.textContent.trim() === 'About';
    });

    if (!aboutSection) return;

    var aboutText = aboutSection.querySelector('p');
    if (aboutText) {
      aboutText.innerHTML =
        'Steeradar v6 · Vanilla JS · MIT License<br>' +
        'Maintained by Shravan';
    }
  }

  function applyShravanUpdates() {
    updateShravanProfile();
    updateRegistrationExamples();
    updateMaintainer();
  }

  // Apply once when the page loads.
  applyShravanUpdates();

  // Also apply when the app unlocks.
  window.addEventListener('steeradar:unlock', function () {
    applyShravanUpdates();
  });

})();
</script>
