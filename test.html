
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Steeradar · Shravan Diagnostic</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont,
    'Inter', system-ui, sans-serif;
  background: #0F1115;
  color: #F2F4F8;
  padding: 20px;
  min-height: 100vh;
  line-height: 1.5;
}

h1 {
  font-size: 1.4rem;
  margin-bottom: 8px;
  color: #00E5C3;
}

p.sub {
  color: #8B92A3;
  font-size: 0.85rem;
  margin-bottom: 20px;
}

.maintainer {
  color: #34D399;
  font-size: 0.8rem;
  margin-bottom: 15px;
}

.file-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  border-radius: 10px;
  background: #1A1E28;
  margin-bottom: 8px;
  border: 1px solid #232834;
  font-size: 0.85rem;
}

.status {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.9rem;
}

.ok {
  background: rgba(16,185,129,0.15);
  color: #34D399;
}

.fail {
  background: rgba(239,68,68,0.15);
  color: #F87171;
}

.warn {
  background: rgba(245,158,11,0.15);
  color: #FBBF24;
}

.pending {
  background: rgba(148,163,184,0.15);
  color: #94A3B8;
}

.info {
  flex: 1;
  min-width: 0;
}

.info .name {
  font-weight: 600;
  word-break: break-all;
}

.info .detail {
  font-family: 'SF Mono', Monaco, monospace;
  font-size: 0.72rem;
  color: #8B92A3;
  margin-top: 4px;
  word-break: break-all;
}

.info .error {
  color: #F87171;
}

.summary {
  margin-top: 20px;
  padding: 16px;
  border-radius: 12px;
  background: #1A1E28;
  border: 1px solid #232834;
}

.summary h2 {
  font-size: 1rem;
  margin-bottom: 8px;
}

.summary .line {
  font-size: 0.85rem;
  color: #B4BAC6;
  padding: 4px 0;
}

.summary .line.ok {
  background: transparent;
  color: #34D399;
}

.summary .line.fail {
  background: transparent;
  color: #F87171;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: #00E5C3;
  color: #0F1115;
  border: none;
  font-weight: 700;
  font-size: 0.95rem;
  margin-top: 16px;
  cursor: pointer;
}

pre {
  background: #14171E;
  padding: 12px;
  border-radius: 10px;
  font-size: 0.72rem;
  overflow-x: auto;
  margin-top: 12px;
  max-height: 300px;
  overflow-y: auto;
  color: #B4BAC6;
  white-space: pre-wrap;
  word-break: break-all;
}

footer {
  margin-top: 25px;
  text-align: center;
  font-size: 0.75rem;
  color: #8B92A3;
}
</style>
</head>

<body>

<h1>Steeradar · Diagnostic</h1>

<p class="sub">
  Checking application files, modules and configuration.
</p>

<p class="maintainer">
  Customized and maintained by Shravan
</p>

<div id="results"></div>
<div id="summary"></div>

<script>

// ============================================================
// STEERADAR DIAGNOSTIC
// Maintainer: Shravan
// Version: 6.0
// ============================================================

// Automatically use the current repository location.
// diagnostic.html should be in the repository root.

const REPO = new URL('./', window.location.href).href;

// Files that should exist in the repository.

const FILES = [
  'index.html',
  'styles.css',
  'config.js',
  'app.js',
  'js/api.js',
  'js/store.js',
  'js/logger.js',
  'js/photos.js',
  'js/auth.js',
  'js/onboarding.js',
  'js/lanes.js',
  'js/hive.js',
  'js/chat.js',
  'js/presence.js',
  'js/app.js'
];

// Required modules for the application.

const CRITICAL = [
  'config.js',
  'js/api.js',
  'js/store.js',
  'js/logger.js',
  'js/photos.js',
  'js/auth.js',
  'js/onboarding.js',
  'js/lanes.js',
  'js/hive.js',
  'js/chat.js',
  'js/presence.js',
  'js/app.js'
];

const resultsEl = document.getElementById('results');
const summaryEl = document.getElementById('summary');

const fileResults = {};

// Display diagnostic results.

function renderRow(name, status, detail) {

  const row = document.createElement('div');

  row.className = 'file-row';

  const statusClass =
    status === 'ok' ? 'ok' :
    status === 'fail' ? 'fail' : 'pending';

  const symbol =
    status === 'ok' ? '✓' :
    status === 'fail' ? '✕' : '…';

  row.innerHTML = `
    <div class="status ${statusClass}">
      ${symbol}
    </div>

    <div class="info">
      <div class="name"></div>
      <div class="detail"></div>
    </div>
  `;

  row.querySelector('.name').textContent = name;
  row.querySelector('.detail').textContent = detail || '—';

  resultsEl.appendChild(row);
}

// Check if a file exists.

async function checkFile(name) {

  const url = new URL(name, REPO).href;

  try {

    const res = await fetch(url, { cache: 'no-store' });

    if (!res.ok) {
      return {
        ok: false,
        status: res.status,
        detail: `HTTP ${res.status} - file unavailable`
      };
    }

    const content = await res.text();

    const size = new Blob([content]).size;

    const firstLine =
      content.split('\n')[0].slice(0, 80);

    const warnings = [];

    if (name.endsWith('.js') && size < 50) {
      warnings.push('Suspiciously small file');
    }

    if (
      name.endsWith('.js') &&
      !content.includes('export') &&
      !name.includes('config') &&
      !name.endsWith('app.js')
    ) {
      warnings.push('No export keyword found');
    }

    return {
      ok: true,
      size,
      warnings,
      detail:
        `${size.toLocaleString()} bytes` +
        ` | Starts: ${firstLine}` +
        (warnings.length
          ? ` | Warning: ${warnings.join(', ')}`
          : '')
    };

  } catch (err) {

    return {
      ok: false,
      status: 0,
      detail: `Fetch failed: ${err.message}`
    };

  }
}

// Run diagnostic checks.

async function runDiagnostics() {

  resultsEl.innerHTML = '';
  summaryEl.innerHTML = '';

  FILES.forEach(file => {
    renderRow(file, 'pending', 'Checking...');
  });

  const rows =
    resultsEl.querySelectorAll('.file-row');

  const checks = await Promise.all(
    FILES.map(file => checkFile(file))
  );

  checks.forEach((result, i) => {

    const name = FILES[i];

    fileResults[name] = result;

    const row = rows[i];

    const statusClass = result.ok ? 'ok' : 'fail';

    const symbol = result.ok ? '✓' : '✕';

    row.querySelector('.status').className =
      'status ' + statusClass;

    row.querySelector('.status').textContent =
      symbol;

    const detail = row.querySelector('.detail');

    detail.className =
      'detail ' + (result.ok ? '' : 'error');

    detail.textContent = result.detail;

  });

  const missing = CRITICAL.filter(
    file => !fileResults[file]?.ok
  );

  const present = CRITICAL.filter(
    file => fileResults[file]?.ok
  );

  const heading = document.createElement('h2');
  heading.textContent = 'Diagnostic Summary';

  summaryEl.className = 'summary';
  summaryEl.appendChild(heading);

  const count = document.createElement('div');
  count.className = 'line ok';
  count.textContent =
    `${present.length} / ${CRITICAL.length} critical files found`;

  summaryEl.appendChild(count);

  const message = document.createElement('div');
  message.className =
    missing.length === 0 ? 'line ok' : 'line fail';

  message.style.marginTop = '8px';

  if (missing.length === 0) {

    message.textContent =
      'All critical files exist. This does not guarantee the app runs correctly.';

  } else {

    message.textContent =
      `${missing.length} critical files missing or inaccessible:`;

  }

  summaryEl.appendChild(message);

  missing.forEach(file => {

    const line = document.createElement('div');

    line.className = 'line fail';
    line.textContent = '• ' + file;

    summaryEl.appendChild(line);

  });

  createCopyButton();

  runModuleTest();
}

// Copy diagnostic report.

function createCopyButton() {

  const oldBtn =
    document.getElementById('copyReportBtn');

  if (oldBtn) oldBtn.remove();

  const btn = document.createElement('button');

  btn.id = 'copyReportBtn';
  btn.textContent = 'Copy Full Report';

  btn.onclick = async () => {

    const report = [
      'STEERADAR DIAGNOSTIC REPORT',
      'Maintained by Shravan',
      'Repository: ' + REPO,
      '',
      ...FILES.map(file => {

        const result = fileResults[file];

        return (
          `[${result?.ok ? 'OK' : 'FAIL'}] ` +
          file +
          ' - ' +
          (result?.detail || 'Unknown')
        );

      })
    ].join('\n');

    try {

      await navigator.clipboard.writeText(report);

      btn.textContent = 'Report Copied!';

      setTimeout(() => {
        btn.textContent = 'Copy Full Report';
      }, 2000);

    } catch (err) {

      btn.textContent = 'Copy failed';

    }

  };

  document.body.appendChild(btn);
}

// Test module imports.

async function runModuleTest() {

  const existing =
    document.getElementById('moduleTest');

  if (existing) existing.remove();

  const testEl = document.createElement('div');

  testEl.id = 'moduleTest';
  testEl.className = 'summary';

  testEl.innerHTML = `
    <h2>Module Import Test</h2>
    <div class="line">
      Attempting to load js/app.js...
    </div>
    <pre id="importResult"></pre>
  `;

  document.body.appendChild(testEl);

  try {

    await import('./js/app.js');

    const result =
      document.getElementById('importResult');

    result.textContent =
      'Module imported successfully. Runtime functionality is not verified.';

    result.style.color = '#34D399';

  } catch (err) {

    const result =
      document.getElementById('importResult');

    result.textContent =
      'Module import failed:\n\n' +
      'Message: ' + (err.message || 'Unknown') +
      '\n\nStack:\n' + (err.stack || '');

    result.style.color = '#F87171';

  }

}

// Start checks.

runDiagnostics();

</script>

<footer>
  Steeradar v6.0
  <p>Customized and maintained by Shravan</p>
  <p>Original copyright notices remain in the LICENSE file.</p>
</footer>

</body>
</html>
